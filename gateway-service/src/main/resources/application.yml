spring:
  application:
    name: gateway-service

  cloud:
    discovery:
      enabled: false

    gateway:
      server:
        webflux:
          routes:
            - id: r1
              uri: lb://CUSTOMER-SERVICE
              predicates:
                - Path=/customers/**

            - id: r2
              uri: lb://INVENTORY-SERVICE
              predicates:
                - Path=/products/**

server:
  port: 8888